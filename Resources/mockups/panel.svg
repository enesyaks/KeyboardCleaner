<svg width="320" height="430" viewBox="0 0 320 430" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif">
  <defs>
    <radialGradient id="tealGlow" cx="0.16" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#1B8A78" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#1B8A78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="0.9" cy="0.96" r="0.6">
      <stop offset="0" stop-color="#E07A3D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E07A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- panel surface -->
  <rect width="320" height="430" rx="16" fill="#131C24"/>
  <rect width="320" height="430" rx="16" fill="url(#tealGlow)"/>
  <rect width="320" height="430" rx="16" fill="url(#orangeGlow)"/>
  <rect x="0.5" y="0.5" width="319" height="429" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- ===== header ===== -->
  <rect x="18" y="18" width="36" height="36" rx="10" fill="#1B8A78" fill-opacity="0.16"/>
  <g transform="translate(36,36)" stroke="#1B8A78" stroke-width="2" stroke-linecap="round" fill="none">
    <rect x="-8" y="-5.5" width="16" height="11" rx="2.5"/>
    <line x1="-4.5" y1="-1.5" x2="4.5" y2="-1.5" stroke-opacity="0.9"/>
    <line x1="-4.5" y1="2" x2="2" y2="2" stroke-opacity="0.9"/>
  </g>
  <text x="64" y="33" font-size="14" font-weight="700" fill="#E8EEF0">KeyboardCleaner</text>
  <text x="64" y="48" font-size="11.5" font-weight="500" fill="#E8EEF0" fill-opacity="0.5">Keyboard protection</text>
  <rect x="252" y="24" width="50" height="20" rx="10" fill="#1B8A78" fill-opacity="0.16"/>
  <text x="277" y="37.5" font-size="10" font-weight="700" letter-spacing="0.6" text-anchor="middle" fill="#1B8A78">READY</text>

  <line x1="18" y1="66" x2="302" y2="66" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- ===== mode grid ===== -->
  <!-- Cleaning (selected) -->
  <rect x="18" y="80" width="138" height="66" rx="12" fill="#E07A3D" fill-opacity="0.14"/>
  <rect x="18.75" y="80.75" width="136.5" height="64.5" rx="11.25" fill="none" stroke="#E07A3D" stroke-opacity="0.5" stroke-width="1.5"/>
  <g transform="translate(87,105)" fill="#E07A3D">
    <path d="M0,-9 C1.4,-2.6 2.6,-1.4 9,0 C2.6,1.4 1.4,2.6 0,9 C-1.4,2.6 -2.6,1.4 -9,0 C-2.6,-1.4 -1.4,-2.6 0,-9 Z"/>
    <path d="M8.5,-9 C8.9,-6.2 9.3,-5.8 12,-5.2 C9.3,-4.6 8.9,-4.2 8.5,-1.4 C8.1,-4.2 7.7,-4.6 5,-5.2 C7.7,-5.8 8.1,-6.2 8.5,-9 Z"/>
  </g>
  <text x="87" y="132" font-size="11.5" font-weight="600" text-anchor="middle" fill="#E8EEF0">Cleaning</text>

  <!-- Baby & Pet -->
  <rect x="164" y="80" width="138" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
  <g transform="translate(233,104)" fill="#E8EEF0" fill-opacity="0.5">
    <circle cx="-6.5" cy="-6" r="3.6"/>
    <circle cx="6.5" cy="-6" r="3.6"/>
    <circle cx="0" cy="1" r="8.5"/>
    <circle cx="0" cy="3" r="3" fill="#1b2731"/>
    <circle cx="-3" cy="-1" r="1.1" fill="#1b2731"/>
    <circle cx="3" cy="-1" r="1.1" fill="#1b2731"/>
  </g>
  <text x="233" y="132" font-size="11.5" font-weight="600" text-anchor="middle" fill="#E8EEF0" fill-opacity="0.6">Baby &amp; Pet</text>

  <!-- Movie -->
  <rect x="18" y="152" width="138" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
  <g transform="translate(87,176)" fill="none" stroke="#E8EEF0" stroke-opacity="0.5" stroke-width="2">
    <rect x="-10" y="-7" width="20" height="14" rx="2.5"/>
    <line x1="-4" y1="-7" x2="-4" y2="7"/>
    <line x1="4" y1="-7" x2="4" y2="7"/>
  </g>
  <text x="87" y="204" font-size="11.5" font-weight="600" text-anchor="middle" fill="#E8EEF0" fill-opacity="0.6">Movie</text>

  <!-- Hand-off -->
  <rect x="164" y="152" width="138" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
  <g transform="translate(233,176)" fill="#E8EEF0" fill-opacity="0.5">
    <circle cx="5" cy="-5" r="3.8"/>
    <path d="M-2.5,7 a7.5,7.5 0 0 1 15,0 Z"/>
    <circle cx="-5" cy="-4" r="4.4" fill="#1b2731"/>
    <path d="M-13,8.5 a8.2,8.2 0 0 1 16.4,0 Z" fill="#1b2731"/>
    <circle cx="-5" cy="-4" r="4" fill="#E8EEF0" fill-opacity="0.5"/>
    <path d="M-12.4,8.2 a7.6,7.6 0 0 1 15.2,0 Z" fill="#E8EEF0" fill-opacity="0.5"/>
  </g>
  <text x="233" y="204" font-size="11.5" font-weight="600" text-anchor="middle" fill="#E8EEF0" fill-opacity="0.6">Hand-off</text>

  <!-- ===== also lock trackpad toggle ===== -->
  <rect x="18" y="230" width="284" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
  <g transform="translate(34,247)" stroke="#E8EEF0" stroke-opacity="0.55" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-5,-6 L3.5,1 L-0.5,1.6 L1.5,6 L-0.3,6.7 L-2.2,2.2 L-5,4.6 Z" fill="#E8EEF0" fill-opacity="0.4" stroke="none"/>
    <line x1="-8" y1="7" x2="8" y2="-7" stroke-opacity="0.7"/>
  </g>
  <text x="50" y="251" font-size="12" font-weight="500" fill="#E8EEF0" fill-opacity="0.72">Also lock trackpad</text>
  <rect x="264" y="238" width="32" height="18" rx="9" fill="#E07A3D"/>
  <circle cx="287" cy="247" r="7" fill="#FFFFFF"/>

  <!-- ===== start button ===== -->
  <rect x="18" y="276" width="284" height="44" rx="12" fill="#E07A3D"/>
  <g transform="translate(112,298)">
    <rect x="-7" y="-1.5" width="14" height="11" rx="2.5" fill="#FFFFFF"/>
    <path d="M-4,-1.5 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <text x="130" y="302.5" font-size="14" font-weight="700" fill="#FFFFFF">Start Cleaning</text>

  <!-- ===== hint ===== -->
  <rect x="18" y="332" width="284" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
  <g transform="translate(34,349)" stroke="#E8EEF0" stroke-opacity="0.4" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="-7" y1="6" x2="7" y2="-6"/>
    <path d="M-5,-6 L3,1 L-0.5,1.4 L1,5" fill="#E8EEF0" fill-opacity="0.35" stroke="none"/>
  </g>
  <text x="50" y="353" font-size="11.5" font-weight="500" fill="#E8EEF0" fill-opacity="0.5">Unlock only with your shortcut</text>

  <line x1="14" y1="384" x2="306" y2="384" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- ===== footer ===== -->
  <text x="22" y="408" font-size="11.5" font-weight="500" fill="#E8EEF0" fill-opacity="0.42">Settings</text>
  <text x="298" y="408" font-size="11.5" font-weight="500" text-anchor="end" fill="#D9584A">Quit</text>
</svg>
