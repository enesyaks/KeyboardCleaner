<svg width="880" height="520" viewBox="0 0 880 520" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', system-ui, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b33"/>
      <stop offset="1" stop-color="#0f171d"/>
    </linearGradient>
    <radialGradient id="dim" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#E07A3D" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="ring" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#E07A3D" stop-opacity="0"/>
      <stop offset="1" stop-color="#E07A3D" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- desktop being covered -->
  <rect width="880" height="520" rx="14" fill="url(#wall)"/>
  <!-- top menu bar hint -->
  <rect width="880" height="26" fill="#000000" fill-opacity="0.25"/>
  <circle cx="20" cy="13" r="4" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="800" y="9" width="60" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.18"/>
  <!-- dim wash -->
  <rect width="880" height="520" rx="14" fill="url(#dim)"/>

  <!-- ===== centered card ===== -->
  <g transform="translate(440,262)">
    <rect x="-190" y="-150" width="380" height="300" rx="28" fill="#0e1519" fill-opacity="0.72"/>
    <rect x="-189.5" y="-149.5" width="379" height="299" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>

    <!-- glyph -->
    <circle cx="0" cy="-82" r="66" fill="url(#ring)"/>
    <circle cx="0" cy="-82" r="52" fill="#E07A3D" fill-opacity="0.16"/>
    <g transform="translate(0,-82)">
      <rect x="-17" y="-4" width="34" height="27" rx="6" fill="#E07A3D"/>
      <path d="M-10,-4 v-7 a10,10 0 0 1 20,0 v7" fill="none" stroke="#E07A3D" stroke-width="5"/>
      <circle cx="0" cy="7" r="4.5" fill="#0e1519"/>
      <rect x="-2" y="8" width="4" height="8" rx="2" fill="#0e1519"/>
    </g>

    <text x="0" y="8" font-size="26" font-weight="700" text-anchor="middle" fill="#FFFFFF">Cleaning mode</text>
    <text x="0" y="34" font-size="14" font-weight="500" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.7">Clean away — mouse and trackpad still work.</text>

    <text x="0" y="86" font-size="42" font-weight="600" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, monospace">00:42</text>

    <!-- hint chip -->
    <rect x="-150" y="112" width="300" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="0" y="131.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85">Press ⌃⌥⇧⌘K or use the menu bar to unlock</text>
  </g>
</svg>
